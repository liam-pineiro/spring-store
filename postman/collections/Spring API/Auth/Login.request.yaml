$kind: http-request
description: ""
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  - key: Authorization
    value: ""
    disabled: true
body:
  type: json
  content: "{\r

    \    \"password\": \"12345678\",\r

    \    \"email\": \"user3@domain.com\"\r

    }"
scripts:
  - type: afterResponse
    code: "var json = pm.response.json();\r

      pm.collectionVariables.set(\"accessToken\", json.token);"
    language: text/javascript
order: 1000
